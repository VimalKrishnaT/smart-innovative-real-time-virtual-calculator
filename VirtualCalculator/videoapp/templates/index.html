<!DOCTYPE html>
<html>
<head>
    <title>VrtualCalc</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap');
        
        /* Global styles */
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #121212;  /* Dark background for contrast */
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            justify-content: center;
            background: linear-gradient(145deg, #1e1e1e, #121212);  /* Gradient background */
        }

        h1 {
            color: #bb86fc;  /* Light purple for a modern look */
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5rem;  /* Larger heading */
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Main container layout */
        .container {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            width: 100%;
            max-width: 1200px;
            gap: 30px;  /* Added space between video and response containers */
            box-sizing: border-box;
        }

        /* Video container styles */
        .video-container {
            border: 3px solid #333;  /* Slightly thicker border for prominence */
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);  /* Box shadow for depth */
            transition: transform 0.3s ease-in-out;
            flex: 2;  /* Reduced from 3 to 2 (reducing the size of the video container by 30%) */
        }

        .video-container img {
            width: 100%;
            height: auto;
            border-radius: 10px;  /* Rounded corners for the video */
        }

        /* Hover effect for video container */
        .video-container:hover {
            transform: scale(1.05);  /* Subtle zoom effect on hover */
        }

        /* Response container styles */
        .response-container {
            border: 2px solid #333;
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 15px;
            max-width: 320px;
            flex: 1;
            overflow-y: auto;
            max-height: 600px;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.4);
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

        /* Hover effect for response container */
        .response-container:hover {
            background-color: #333;
            transform: translateY(-5px);
        }

        .response-container h2 {
            color: #bb86fc;
            margin-top: 0;
            font-size: 1.5rem;
        }

        #response {
            padding: 10px;
        }

        .response-container p {
            word-wrap: break-word;
            font-size: 1.1rem;
            line-height: 1.5;
        }

        /* Responsive design adjustments */
        @media (max-width: 1200px) {
            .container {
                flex-direction: column;
                align-items: center;
            }

            .video-container {
                max-width: 90%;  /* More flexible on smaller screens */
            }

            .response-container {
                max-width: 100%;
                margin-top: 20px;
            }
        }

    </style>
    <script>
        function fetchResponse() {
            fetch('/get_response')
                .then(response => response.json())
                .then(data => {
                    if (data.response) {
                        document.getElementById('response').innerHTML = '<h2></h2><p>' + data.response + '</p>';
                    }
                })
                .catch(error => console.error('Error fetching response:', error));
        }

        setInterval(fetchResponse, 1000);  // Fetch response every second
    </script>
</head>
<body>
    <h1>VrtualCalc</h1>
    <div class="container">
        <div class="video-container">
            <img src="{% url 'video_feed' %}" width="1200" />
        </div>
        <div class="response-container">
            <div id="response">
                <h2></h2>
            </div>
        </div>
    </div>
</body>
</html>
